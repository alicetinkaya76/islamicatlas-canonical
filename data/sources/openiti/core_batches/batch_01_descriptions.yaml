# Çekirdek Külliyat Parti-1 — EDİTORYAL tanıtımlar (H13 S-D D2).
# Kendi metnimizdir (CC-BY-SA); DİA metni KULLANILMAMIŞTIR (İSAM izni yayın
# şartı, ADR-014). Genel literatür bilgisi düzeyinde, 2-4 cümle.
descriptions:
  0279Baladhuri.FutuhBuldan:
    tr: >-
      Belâzürî'nin (ö. 279/892-93) İslam fetihlerini bölge bölge anlatan
      klasik eseri. Arap Yarımadası'ndan Suriye, Irak, İran, Mısır, Kuzey
      Afrika ve Endülüs'e uzanan fetihleri şehir şehir; antlaşma metinleri,
      vergi düzenlemeleri ve iskân bilgileriyle birlikte aktarır. Erken İslam
      tarihî coğrafyasının birincil kaynağıdır.
    en: >-
      Al-Balādhurī's (d. 279/892-93) classic account of the Islamic conquests,
      arranged region by region — from Arabia through Syria, Iraq, Iran,
      Egypt, North Africa and al-Andalus — recording treaties, tax
      arrangements and settlement history city by city. A primary source for
      the historical geography of early Islam.
  0207Waqidi.Maghazi:
    tr: >-
      Vâkıdî'nin (ö. 207/823) Hz. Peygamber'in seferlerini kronolojik ve
      topografik ayrıntıyla anlatan eseri. Bedir'den Tebük'e her seferin
      güzergâhı, tarihleri ve katılımcıları titizlikle kaydedilir; sîre
      coğrafyasının ana kaynağıdır.
    en: >-
      Al-Wāqidī's (d. 207/823) chronologically and topographically detailed
      account of the Prophet's campaigns, from Badr to Tabūk, recording
      routes, dates and participants — the principal source for the
      geography of the maghāzī.
  0213IbnHisham.SiraNabawiyya:
    tr: >-
      İbn Hişâm'ın (ö. 213/828 [218/833]) İbn İshâk rivayetini süzerek
      düzenlediği, Hz. Peygamber'in hayatının günümüze ulaşan en eski kapsamlı
      anlatısı. Sîre yazımının bütün sonraki geleneği bu metin üzerine kurulur.
    en: >-
      Ibn Hishām's (d. 213/828 [218/833]) redaction of Ibn Isḥāq's narrative —
      the oldest comprehensive extant biography of the Prophet, on which the
      entire later sīra tradition rests.
  0487AbuCubaydBakri.MucjamMaIstacjama:
    tr: >-
      Endülüslü coğrafyacı Bekrî'nin (ö. 487/1094) Arap Yarımadası ağırlıklı
      alfabetik yer adları sözlüğü. Yer adlarının doğru okunuşunu, konumunu ve
      ilgili şiir-haber malzemesini derler; Yâkût'un Mu'cemü'l-Büldân'ının
      önemli öncüsüdür.
    en: >-
      The Andalusi geographer al-Bakrī's (d. 487/1094) alphabetical dictionary
      of toponyms, focused on the Arabian Peninsula — fixing correct
      vocalisation, location and associated poetry and reports; a major
      precursor of Yāqūt's Muʿjam al-buldān.
  0367IbnHawqal.SuratArd:
    tr: >-
      İbn Havkal'ın (ö. 367/977'den sonra) "Belh okulu" geleneğindeki
      coğrafya eseri; İslam dünyasını bölge bölge haritalarla tasvir eder.
      Otuz yıla yaklaşan seyahat gözlemleriyle ticaret yolları, şehirler ve
      iktisadi hayata dair zengin ayrıntı içerir.
    en: >-
      Ibn Ḥawqal's (d. after 367/977) geography in the "Balkhī school"
      tradition, describing the Islamic world region by region with maps,
      enriched by nearly three decades of travel — trade routes, cities and
      economic life in vivid detail.
  0346Istakhri.MasalikWaMamalik:
    tr: >-
      İstahrî'nin (ö. yaklaşık 346/957) yirmi iklim düzeninde İslam dünyasını
      anlatan coğrafya klasiği; her bölgenin şehirlerini, MESAFELERİYLE yol
      ağlarını (mesâlik) ve haritalarını verir. İbn Havkal'ın eserinin
      temelidir.
    en: >-
      Al-Iṣṭakhrī's (d. c. 346/957) classic geography of the Islamic world in
      twenty regions, giving each province's cities, its road network WITH
      distances (masālik), and maps — the foundation on which Ibn Ḥawqal
      built.
  0560SharifIdrisi.NuzhatMushtaq:
    tr: >-
      Şerîf el-İdrîsî'nin (ö. 560/1165) Sicilya kralı II. Roger için yazdığı
      dünya coğrafyası; yedi iklimi yetmiş bölümde haritalarıyla anlatır.
      Ortaçağ'ın en gelişmiş dünya tasviri sayılır ve İslam coğrafyacılığını
      Avrupa'ya taşıyan köprüdür.
    en: >-
      Al-Sharīf al-Idrīsī's (d. 560/1165) world geography written for Roger II
      of Sicily, covering the seven climes in seventy map-sections — the most
      advanced medieval description of the world and the bridge carrying
      Islamic geography to Europe.
  0614IbnJubayr.Rihla:
    tr: >-
      Endülüslü seyyah İbn Cübeyr'in (ö. 614/1217) 1183-1185 hac yolculuğunun
      günlüğü: Mısır, Hicaz, Irak, Suriye ve Haçlı dönemindeki Akkâ ile
      Sicilya'nın birinci elden tasviri. Rihle türünün kurucu metni olup İbn
      Battûta'dan bir buçuk asır öncesinin dünyasını belgeler.
    en: >-
      The travel diary of the Andalusi pilgrim Ibn Jubayr (d. 614/1217),
      1183-1185: first-hand descriptions of Egypt, the Hijaz, Iraq, Syria,
      Crusader Acre and Sicily. The founding text of the riḥla genre,
      documenting the world a century and a half before Ibn Baṭṭūṭa.
  0249Azraqi.AkhbarMakka:
    tr: >-
      Ezrakî'nin (ö. yaklaşık 250/864) Mekke'nin ve Kâbe'nin tarihine dair
      günümüze ulaşan en eski eseri: Harem'in yapıları, sınırları, kuyuları
      ve mahalleleri ölçüleriyle kaydedilir. Mekke şehir topografyasının
      temel kaynağıdır.
    en: >-
      Al-Azraqī's (d. c. 250/864) history of Mecca and the Kaʿba — the oldest
      extant work of its kind, recording the sanctuary's buildings,
      boundaries, wells and quarters with measurements. The foundational
      source for Meccan urban topography.
  0463KhatibBaghdadi.TarikhBaghdad:
    tr: >-
      Hatîb el-Bağdâdî'nin (ö. 463/1071) dev eseri: Bağdat'ın topografyasına
      dair ayrıntılı bir girişin ardından şehirle ilişkili binlerce âlimin
      biyografisini verir. Hem Bağdat şehir tarihinin hem de rical
      literatürünün anıtsal kaynağıdır.
    en: >-
      Al-Khaṭīb al-Baghdādī's (d. 463/1071) monumental work: a detailed
      topographical introduction to Baghdad followed by thousands of
      biographies of scholars connected with the city — a foundational source
      at once for Baghdad's urban history and for rijāl literature.
