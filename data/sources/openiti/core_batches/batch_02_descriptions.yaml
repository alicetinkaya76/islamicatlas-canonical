# Çekirdek Külliyat Parti-2 — EDİTORYAL tanıtımlar (H16).
# Kendi metnimizdir (CC-BY-SA); DİA metni KULLANILMAMIŞTIR (ADR-014/İSAM).
descriptions:
  0630IbnAthirCizzDin.Kamil:
    tr: >-
      İzzeddin İbn el-Esîr'in (ö. 630/1233) yaratılıştan 628/1231'e kadar
      uzanan evrensel tarihi. Taberî'yi esas alıp yıl yıl devam eder; Haçlı
      seferleri, Selçuklu ve Moğol istilası için birinci elden tanıklık
      sunar. Atlasın Salibiyyât katmanının başlıca kaynaklarındandır.
    en: >-
      ʿIzz al-Dīn Ibn al-Athīr's (d. 630/1233) universal history from
      creation to 628/1231. Building on al-Ṭabarī and continuing year by
      year, it is a first-hand witness for the Crusades, the Seljuqs and the
      Mongol invasion — a principal source behind the atlas's Salibiyyāt
      layer.
  0845Maqrizi.Suluk:
    tr: >-
      Makrîzî'nin (ö. 845/1442) Eyyûbî ve Memlük devletlerini yıl yıl
      anlatan kroniği. Kahire merkezli bakışıyla Haçlı seferleri, Moğol
      akınları ve Memlük iç siyasetinin ayrıntılı kaydıdır; Hıtat'ın tarihî
      tamamlayıcısıdır.
    en: >-
      Al-Maqrīzī's (d. 845/1442) year-by-year chronicle of the Ayyubid and
      Mamluk states. Written from Cairo, it records the Crusades, Mongol
      incursions and Mamluk politics in detail — the historical companion
      to his Khiṭaṭ.
  0310Tabari.Tarikh:
    tr: >-
      Taberî'nin (ö. 310/923) yaratılıştan 302/915'e kadar uzanan devasa
      tarihi. Rivayetleri isnadlarıyla yan yana koyan yöntemiyle erken İslam
      tarihinin ana kaynağı; sonraki bütün kroniklerin dayanağıdır.
    en: >-
      Al-Ṭabarī's (d. 310/923) monumental history from creation to 302/915.
      By juxtaposing reports with their chains of transmission it became the
      principal source for early Islamic history and the foundation of every
      later chronicle.
  0346Mascudi.MurujDhahab:
    tr: >-
      Mes'ûdî'nin (ö. 345/956) tarih ile coğrafyayı birleştiren eseri.
      Halkların, ülkelerin, denizlerin ve âdetlerin tasvirini hânedan
      tarihiyle iç içe verir; "Arapların Herodot'u" nitelemesini kazandıran
      geniş ufuklu bir dünya tablosudur.
    en: >-
      Al-Masʿūdī's (d. 345/956) fusion of history and geography, weaving
      descriptions of peoples, lands, seas and customs into dynastic
      history — the broad world-picture that earned him the title
      "Herodotus of the Arabs".
  0292Yacqubi.Buldan:
    tr: >-
      Ya'kûbî'nin (ö. 292/905) idarî coğrafya eseri: Bağdat ve Sâmerrâ'dan
      başlayarak İslam dünyasının şehirlerini yollar, mesafeler, halklar ve
      vergi gelirleriyle sayar. Türünün en erken örneklerindendir.
    en: >-
      Al-Yaʿqūbī's (d. 292/905) administrative geography: starting from
      Baghdad and Samarra it enumerates the cities of the Islamic world with
      their roads, distances, peoples and tax revenues — among the earliest
      works of its kind.
  0732AbuFida.TaqwimBuldan:
    tr: >-
      Ebü'l-Fidâ'nın (ö. 732/1331) coğrafya eseri: iklim iklim düzenlenmiş
      tablolarda şehirlerin ENLEM ve BOYLAM değerlerini verir. Ortaçağ İslam
      coğrafyasının matematiksel geleneğini özetleyen bir başvuru kitabıdır.
    en: >-
      Abū al-Fidāʾ's (d. 732/1331) geography, giving the LATITUDE and
      LONGITUDE of cities in tables arranged by clime — a reference work
      summarising the mathematical tradition of medieval Islamic geography.
  0571IbnCasakir.TarikhDimashq:
    tr: >-
      İbn Asâkir'in (ö. 571/1176) Dımaşk şehrine dair dev eseri: şehrin
      topografyasını anlatan girişin ardından Dımaşk'a uğramış on binlerce
      kişinin biyografisini verir. Şam tarihinin ve rical literatürünün
      anıtsal kaynağıdır.
    en: >-
      Ibn ʿAsākir's (d. 571/1176) monumental work on Damascus: a
      topographical introduction followed by biographies of the tens of
      thousands who passed through the city — a foundational source for
      Syrian history and for rijāl literature.
