adapter_id: scholars
display_name: "islamicatlas v1 scholars layer — 49 core scholars (bilingual cards)"
adapter_version: 0.1.0
source_kind: digital_corpus
languages: [tr, en]
license: "islamicatlas.org v1 app data (own project; DİA-sourced editorial cards)"
extraction_method: structured_json

target_namespaces: [person]

# H11 S4: db.json TESLİM EDİLDİ → evren 450 âlim (H10 S3'ün 49'luk sınırı
# kalktı; 296 kimlik kartının tamamı adreslenebilir).
input_paths:
  - data/sources/scholars/db.json               # H11 S4: v1 isim otoritesi (450 âlim; kullanıcı teslimi 2026-07-12)
  - data/sources/scholars/scholars.csv
  - data/sources/scholars/scholars_converted.json

output_paths:
  - data/canonical/person/

sidecar_pending:
  scholars_augment: data/_state/scholars_augment_pending.json

provenance_template:
  source_id_pattern: "scholars:{scholar_id}"
  page_or_locator_pattern: "scholars.csv scholar_id={scholar_id}"
  edition_or_version: "islamicatlas v1 scholars layer (v4.8.x)"

reconciliation:
  enabled: false   # EntityResolver (Tier-1/2/3) kullanılır

maintainer: https://orcid.org/0000-0002-7747-6854
contact_for_updates: [ali.cetinkaya@selcuk.edu.tr]
