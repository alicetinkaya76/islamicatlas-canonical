# Adapter registry — single source of truth for all adapters + their configs.
# H9 Stage 4 correction: a run_all_adapters.py orchestrator was never built —
# adapters run ONE AT A TIME via `python3 pipelines/run_adapter.py --id <id>`,
# which reads ONLY the matching entry's `config:` block (pipeline_name etc.).
# `enabled`/`priority`/`depends_on` are planning/documentation metadata until
# an orchestrator exists (Faz 0.5 candidate — see docs/PHASE0_CLOSEOUT.md).
# run_adapter matches this file's entries against the CLI --id argument (and
# resolves the folder from the same --id, hyphen→underscore). So: run with the
# EXACT adapter_id listed here — an unmatched --id silently falls back to a
# generic pipeline_name in every record's provenance (this exact miss stamped
# 9,330 work records "canonicalize_work" — see Stage 5 journal). Keeping
# adapter_id == manifest id is the convention that makes that alignment hold.
# Adding a new adapter: copy pipelines/adapters/_template/, edit manifest.yaml,
# and add a line below.

version: 0.1.0

adapters:
  # Phase 0 (Hafta 2): Bosworth pilot. Seeds the dynasty namespace.
  - adapter_id: bosworth
    enabled: true                 # Hafta 2 ETL pilot — 186 NIDs in one CSV-driven pass
    priority: 100
    config:
      strict_mode: true
      reconciliation_threshold: 0.85
      namespace: dynasty
      pipeline_name: canonicalize_dynasty

  # Phase 0 (Hafta 3): Yâqūt pilot. Seeds the place namespace (~12,954 entries).
  - adapter_id: yaqut
    enabled: true                 # Hafta 3 — Yâqūt al-Hamawī Muʿjam al-Buldān
    priority: 200
    config:
      strict_mode: true
      reconciliation_threshold: 0.85
      namespace: place
      pipeline_name: canonicalize_place_yaqut

  # Phase 0 (Hafta 3): Muqaddasī Aḥsan al-Taqāsīm. Adds 21 iqlims, 2049 places, 1427 routes.
  - adapter_id: muqaddasi
    enabled: true                 # Hafta 3 — al-Muqaddasī (d. 390/1000)
    priority: 205
    config:
      strict_mode: true
      reconciliation_threshold: 0.85
      namespace: place
      pipeline_name: canonicalize_place_muqaddasi
      depends_on: [yaqut]         # Muqaddasī xref resolves into existing Yâqūt PIDs

  # Phase 0 (Hafta 3): Le Strange. Augments places with administrative-region context.
  - adapter_id: le-strange
    enabled: true                 # Hafta 3 — Le Strange Lands of the Eastern Caliphate
    priority: 210
    config:
      strict_mode: true
      mode: merge_into_existing_places
      namespace: place
      pipeline_name: canonicalize_place_le_strange
      depends_on: [yaqut]

  # Phase 0 (Hafta 4): Science Layer migration. Seeds the person namespace from
  # 182 curated scholar entries with full trilingual names + dates + xref to alam/yaqut.
  - adapter_id: science-layer
    enabled: true
    priority: 300
    config:
      strict_mode: true
      reconciliation_threshold: 0.85
      namespace: person
      pipeline_name: canonicalize_person_science_layer

  # Phase 0 (Hafta 4): Bosworth rulers fix-up. Promotes inline rulers to person PIDs.
  - adapter_id: bosworth-rulers-fixup
    enabled: true
    priority: 305
    config:
      strict_mode: true
      reconciliation_threshold: 0.85
      namespace: person
      pipeline_name: canonicalize_person_from_bosworth_rulers
      depends_on: [bosworth]

  # Phase 0 (Hafta 4): DİA biographies. Primary mass-seed of person namespace.
  # ~7,300 distinct persons from 19,742 chunks across 8,093 slugs.
  - adapter_id: dia
    enabled: true
    priority: 310
    config:
      strict_mode: true
      reconciliation_threshold: 0.85
      namespace: person
      pipeline_name: canonicalize_person_dia
      depends_on: [science-layer, bosworth-rulers-fixup]

  # Phase 0 (Hafta 4): El-Aʿlām (Ziriklī). Two-track: augment DİA-known persons,
  # mint new for the rest (~12,500 net new).
  - adapter_id: el-alam
    enabled: true
    priority: 320
    config:
      strict_mode: true
      mode: two_track_augment_or_mint
      reconciliation_threshold: 0.85
      namespace: person
      pipeline_name: canonicalize_person_el_alam
      depends_on: [dia]

  # Phase 0 (Hafta 5): OpenITI work seed (folder: openiti_works/).
  # H9 Stage 4: id corrected 'openiti' → 'openiti-works' (manifest id); the
  # mismatch made run_adapter ignore this entry's config entirely.
  - adapter_id: openiti-works
    enabled: true                 # H5 bulk complete (~9.1K works minted)
    priority: 400
    config:
      strict_mode: true
      namespace: work
      pipeline_name: canonicalize_work_openiti

  # Phase 0 (Hafta 5): Science-layer works (folder: science_works/).
  # H9 Stage 4: entry was missing entirely (same provenance fallout as above).
  - adapter_id: science-works
    enabled: true                 # H5 complete (science_layer.json works)
    priority: 410
    config:
      strict_mode: true
      namespace: work
      pipeline_name: canonicalize_work_science
      depends_on: [science-layer, openiti-works]

  # Phase 0 (Hafta 8): DİA full-narrative upgrade pass.
  # Re-aggregates dia_chunks per slug (ADR-012 50K limit), gap-fills
  # prefLabel.ar (Arabic-script validated) + death_temporal (extended date
  # parser) where H4's pass left them empty. Augments
  # provenance.derived_from with dia-chunks-v8:<slug>; never overwrites
  # existing fields. Operates on the 3,309 Cat A slugs (slug present in
  # data/_state/dia_slug_to_pid.slug_to_pid).
  - adapter_id: dia-person-enrichment-v8
    enabled: true                 # H8 Stage 6 close — Cat A bulk complete (3,309/3,309 enriched)
    priority: 325
    config:
      strict_mode: true
      namespace: person
      pipeline_name: enrich_person_dia_v8
      depends_on: [dia, el-alam]

# Phase 0 (Hafta 9): TDV DiA web metadata scrape (AO). SOURCE-PRODUCING —
  # writes data/sources/dia_chunks_rich.json (cilt+sayfa + arabic title +
  # per-section müellif), NOT canonical records. Run via
  # pipelines/adapters/dia_tdv_scrape/scrape.py, NOT run_adapter.py
  # (target_namespaces intentionally empty → run_adapter rejects it by design).
  # Gated on ADR-014 (İSAM written permission). `enabled` is N/A for the
  # run_adapter path; kept false + listed for registry visibility/provenance.
  - adapter_id: dia-tdv-scrape
    enabled: false                # H9 Stage 2b scaffold — source-side fetch; enable N/A
    priority: 330
    config:
      pipeline_name: scrape_dia_tdv     # informational; not a canonicalize pipeline
      compliance_adr: ADR-014
      depends_on: [dia]

