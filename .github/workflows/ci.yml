name: CI

# H9 Stage 4 rewrite. The previous workflow was doubly broken:
#   * smoke-test-audit called scripts/week1_audit.py — the file does not exist
#     → guaranteed red on every push;
#   * schema validation globbed schema/canonical/* (also nonexistent) → 0
#     files validated, reported green (and used Draft7 against 2020-12
#     schemas).
# It also only fired on `main`, while all H5+ work lives on hafta* branches.
# This version runs the REAL suite. The canonical store (data/canonical,
# data/_state) is gitignored, so store-dependent tests skip themselves on a
# fresh clone (guards added in H9 Stage 3) — measured storeless-green locally.

on:
  push:
    branches: [main, "hafta*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Schema + projector + resolver + integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the full gate (same entry point as local `make test`)
        run: make test

  lint:
    name: Ruff (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint (advisory until a cleanup pass adopts a config)
        run: ruff check pipelines/ search/ tests/
        continue-on-error: true
